version: '3.8'

services:
  python-pipeline:
    build:
      context: ./python-pipeline
    ports:
      # Only the backend needs this service; don't expose it beyond this machine
      - "127.0.0.1:5001:5001"
    env_file:
      - ./python-pipeline/.env
    volumes:
      - ./temp:/temp

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHON_API_URL=http://python-pipeline:5001
      - PORT=5000
    volumes:
      - ./temp:/temp
      # Persist job history and the scheduler database (connected accounts, publishing queue)
      - ./backend/data:/app/data
    depends_on:
      - python-pipeline

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin via nginx proxy (/api, /temp, /auth → backend)
        - VITE_API_URL=
    ports:
      - "80:80"
      # Fallback just in case port 80 is taken
      - "5173:80"
    depends_on:
      - backend
